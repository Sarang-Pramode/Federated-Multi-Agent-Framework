  <text x="404" y="175" font-family="WPSans" font-size="6.2" fill="#123F72" text-anchor="middle">registry decides what is reachable</text>
  <text x="404" y="196" font-family="WPSans" font-size="6.4" fill="#16202B" text-anchor="middle" font-weight="bold">simplest sufficient execution unit</text>
