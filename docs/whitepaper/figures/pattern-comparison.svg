  <text x="404" y="221" font-family="WPSans" font-size="6.2" fill="#0F7267" text-anchor="middle">cost: a real control plane to run</text>
  <line x1="8" y1="256" x2="480" y2="256" stroke="#E7ECF1" stroke-width="0.8"/>
  <text x="8" y="270" font-family="WPSans" font-size="7" fill="#16202B" font-weight="bold">Selection rule</text>
  <text x="8" y="282" font-family="WPSans" font-size="6.6" fill="#5D6C7B">Prefer the fewest reasoning hops that still preserve domain autonomy, enforceable authority and independent</text>
  <text x="8" y="292" font-family="WPSans" font-size="6.6" fill="#5D6C7B">deployability. Pattern C is a superset: it can host A for a bounded domain and B between two consenting peers.</text>
