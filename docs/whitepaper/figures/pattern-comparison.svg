  <text x="244" y="196.5" font-family="WPSans" font-size="6.2" fill="#5D6C7B" text-anchor="middle">no owner of the end to end deadline</text>
  <text x="244" y="207" font-family="WPSans" font-size="6.2" fill="#5D6C7B" text-anchor="middle">no closed world reachability proof</text>
  <text x="244" y="221" font-family="WPSans" font-size="6.2" fill="#9C2B2B" text-anchor="middle">loops are emergent, not designed</text>
