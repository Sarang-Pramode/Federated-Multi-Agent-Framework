  <text x="84" y="148" font-family="WPSans" font-size="7" fill="#A8551A" text-anchor="middle" font-weight="bold">12 of 12 components re-verified</text>
  <text x="18" y="162" font-family="WPSans" font-size="6.3" fill="#A8551A">•</text>
  <text x="24" y="162" font-family="WPSans" font-size="6.3" fill="#5D6C7B">central prompt edited</text>
  <text x="18" y="172.7" font-family="WPSans" font-size="6.3" fill="#A8551A">•</text>
  <text x="24" y="172.7" font-family="WPSans" font-size="6.3" fill="#5D6C7B">all 12 skills share context</text>
  <text x="18" y="183.4" font-family="WPSans" font-size="6.3" fill="#A8551A">•</text>
  <text x="24" y="183.4" font-family="WPSans" font-size="6.3" fill="#5D6C7B">full regression suite</text>
  <text x="18" y="194.1" font-family="WPSans" font-size="6.3" fill="#A8551A">•</text>
  <text x="24" y="194.1" font-family="WPSans" font-size="6.3" fill="#5D6C7B">release train couples teams</text>
