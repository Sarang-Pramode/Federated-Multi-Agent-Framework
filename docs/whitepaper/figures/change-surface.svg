  <text x="184" y="162" font-family="WPSans" font-size="6.3" fill="#5D6C7B">peers hold private</text>
  <text x="184" y="171.2" font-family="WPSans" font-size="6.3" fill="#5D6C7B">expectations</text>
  <text x="178" y="181.9" font-family="WPSans" font-size="6.3" fill="#9C2B2B">•</text>
  <text x="184" y="181.9" font-family="WPSans" font-size="6.3" fill="#5D6C7B">no shared contract to test</text>
