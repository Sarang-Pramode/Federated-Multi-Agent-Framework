  <text x="338" y="162" font-family="WPSans" font-size="6.3" fill="#0F7267">•</text>
  <text x="344" y="162" font-family="WPSans" font-size="6.3" fill="#5D6C7B">one manifest changes</text>
  <text x="338" y="172.7" font-family="WPSans" font-size="6.3" fill="#0F7267">•</text>
  <text x="344" y="172.7" font-family="WPSans" font-size="6.3" fill="#5D6C7B">auditor recomputes</text>
  <text x="344" y="181.9" font-family="WPSans" font-size="6.3" fill="#5D6C7B">reachability</text>
  <text x="338" y="192.6" font-family="WPSans" font-size="6.3" fill="#0F7267">•</text>
  <text x="344" y="192.6" font-family="WPSans" font-size="6.3" fill="#5D6C7B">targeted suite by change type</text>
  <text x="338" y="203.3" font-family="WPSans" font-size="6.3" fill="#0F7267">•</text>
  <text x="344" y="203.3" font-family="WPSans" font-size="6.3" fill="#5D6C7B">domain deploys alone</text>
  <line x1="8" y1="258" x2="480" y2="258" stroke="#E7ECF1" stroke-width="0.8"/>
  <text x="8" y="272" font-family="WPSans" font-size="7" fill="#16202B" font-weight="bold">Why the difference is structural, not a matter of discipline</text>
  <text x="8" y="284" font-family="WPSans" font-size="6.6" fill="#5D6C7B">A shared prompt is a shared mutable global. A mesh has no artefact that states what the system may do. A manifest plus</text>
  <text x="8" y="294" font-family="WPSans" font-size="6.6" fill="#5D6C7B">an independent reachability check turns "what changed" into a computable set, which is what makes targeted evaluation</text>
  <text x="8" y="304" font-family="WPSans" font-size="6.6" fill="#5D6C7B">sound rather than merely cheaper.</text>
