  <text x="333" y="64" font-family="WPSans" font-size="6.5" fill="#16202B" font-weight="bold">Gate decides</text>
  <text x="333" y="77" font-family="WPSans" font-size="5.8" fill="#5D6C7B">block, allow, or a</text>
  <text x="333" y="85.4" font-family="WPSans" font-size="5.8" fill="#5D6C7B">named exception</text>
