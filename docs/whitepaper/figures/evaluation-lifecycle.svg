  <text x="271" y="301.2" font-family="WPSans" font-size="6.2" fill="#5D6C7B">not triggered</text>
  <rect x="8" y="319" width="472" height="40" fill="#F9EAEA" rx="3" stroke="#9C2B2B" stroke-width="1"/>
  <text x="16" y="333" font-family="WPSans" font-size="7" fill="#9C2B2B" font-weight="bold">Why the auditor must not be the team that changed the code</text>
  <text x="16" y="345" font-family="WPSans" font-size="6.4" fill="#26333F">A team that selects its own evidence will select evidence that passes. The auditor is deliberately rule-based rather than</text>
  <text x="16" y="354" font-family="WPSans" font-size="6.4" fill="#26333F">model-based so its verdict is reproducible, cheap to run on every change, and impossible to argue with after the fact.</text>
  <rect x="0.5" y="0.5" width="487" height="368" fill="none" rx="3" stroke="#E7ECF1" stroke-width="1"/>
