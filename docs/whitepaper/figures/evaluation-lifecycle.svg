  <circle cx="417.5" cy="43" r="6.6" fill="#A8551A"/>
  <text x="417.5" y="45.4" font-family="WPSans" font-size="6.8" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text>
  <text x="412.5" y="64" font-family="WPSans" font-size="6.5" fill="#16202B" font-weight="bold">Prod sampling</text>
  <text x="412.5" y="77" font-family="WPSans" font-size="5.8" fill="#5D6C7B">async judges and</text>
  <text x="412.5" y="85.4" font-family="WPSans" font-size="5.8" fill="#5D6C7B">drift by slice</text>
  <line x1="400.5" y1="43" x2="400.636" y2="43" stroke="#D2DAE2" stroke-width="1"/>
  <polygon points="404.5,43 400.3,44.932 400.3,41.068" fill="#D2DAE2"/>
  <polyline points="442.75,104 442.75,117 45.25,117 45.25,108" fill="none" stroke="#A8551A" stroke-width="1" stroke-dasharray="3,2"/>
  <polygon points="45.25,104 42.05,110 48.45,110" fill="#A8551A"/>
  <text x="244" y="128" font-family="WPSans" font-size="6.3" fill="#A8551A" text-anchor="middle" font-style="italic">failures become regression cases; the corpus grows from production, not from imagination</text>
  <text x="8" y="138" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">Which suites a change type triggers</text>
