  <text x="261.6" y="160" font-family="WPSans" font-size="6.1" fill="#8494A3" text-anchor="middle" font-weight="bold">Contract</text>
  <text x="324" y="160" font-family="WPSans" font-size="6.1" fill="#8494A3" text-anchor="middle" font-weight="bold">Safety rails</text>
  <text x="386.4" y="160" font-family="WPSans" font-size="6.1" fill="#8494A3" text-anchor="middle" font-weight="bold">Latency budget</text>
  <text x="448.8" y="160" font-family="WPSans" font-size="6.1" fill="#8494A3" text-anchor="middle" font-weight="bold">Cross domain</text>
