<svg xmlns="http://www.w3.org/2000/svg" width="488" height="369" viewBox="0 0 488 369">
  <text x="8" y="17" font-family="WPSans" font-size="7.4" fill="#16202B" font-weight="bold">Evaluation is a release gate computed from the change, not a suite someone remembers to run</text>
  <rect x="8" y="30" width="74.5" height="74" fill="#EFF3F7" rx="3" stroke="#5D6C7B" stroke-width="1"/>
  <circle cx="20" cy="43" r="6.6" fill="#5D6C7B"/>
  <text x="20" y="45.4" font-family="WPSans" font-size="6.8" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
  <text x="15" y="64" font-family="WPSans" font-size="6.5" fill="#16202B" font-weight="bold">Change lands</text>
  <text x="15" y="77" font-family="WPSans" font-size="5.8" fill="#5D6C7B">prompt, tool, skill,</text>
  <text x="15" y="85.4" font-family="WPSans" font-size="5.8" fill="#5D6C7B">model, or manifest</text>
  <rect x="87.5" y="30" width="74.5" height="74" fill="#E8F0F8" rx="3" stroke="#1C5A9E" stroke-width="1"/>
  <circle cx="99.5" cy="43" r="6.6" fill="#1C5A9E"/>
  <text x="99.5" y="45.4" font-family="WPSans" font-size="6.8" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
  <text x="94.5" y="64" font-family="WPSans" font-size="6.5" fill="#16202B" font-weight="bold">Classify change</text>
  <text x="94.5" y="77" font-family="WPSans" font-size="5.8" fill="#5D6C7B">the change type picks</text>
  <text x="94.5" y="85.4" font-family="WPSans" font-size="5.8" fill="#5D6C7B">the suite, by rule</text>
  <line x1="82.5" y1="43" x2="82.636" y2="43" stroke="#D2DAE2" stroke-width="1"/>
  <polygon points="86.5,43 82.3,44.932 82.3,41.068" fill="#D2DAE2"/>
