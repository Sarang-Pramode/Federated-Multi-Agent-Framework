  <text x="179" y="45.4" font-family="WPSans" font-size="6.8" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
  <text x="174" y="64" font-family="WPSans" font-size="6.5" fill="#16202B" font-weight="bold">Auditor runs</text>
  <text x="174" y="77" font-family="WPSans" font-size="5.8" fill="#5D6C7B">reachability, manifest</text>
  <text x="174" y="85.4" font-family="WPSans" font-size="5.8" fill="#5D6C7B">and hash integrity</text>
  <line x1="162" y1="43" x2="162.136" y2="43" stroke="#D2DAE2" stroke-width="1"/>
  <polygon points="166,43 161.8,44.932 161.8,41.068" fill="#D2DAE2"/>
  <rect x="246.5" y="30" width="74.5" height="74" fill="#E4F1EF" rx="3" stroke="#0F7267" stroke-width="1"/>
  <circle cx="258.5" cy="43" r="6.6" fill="#0F7267"/>
  <text x="258.5" y="45.4" font-family="WPSans" font-size="6.8" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
  <text x="253.5" y="64" font-family="WPSans" font-size="6.5" fill="#16202B" font-weight="bold">Suites run</text>
  <text x="253.5" y="77" font-family="WPSans" font-size="5.8" fill="#5D6C7B">golden set, safety,</text>
  <text x="253.5" y="85.4" font-family="WPSans" font-size="5.8" fill="#5D6C7B">contract, latency</text>
  <line x1="241.5" y1="43" x2="241.636" y2="43" stroke="#D2DAE2" stroke-width="1"/>
  <polygon points="245.5,43 241.3,44.932 241.3,41.068" fill="#D2DAE2"/>
