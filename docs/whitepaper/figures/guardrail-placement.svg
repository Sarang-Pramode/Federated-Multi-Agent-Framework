  <line x1="449" y1="190" x2="449" y2="204" stroke="#D2DAE2" stroke-width="0.7" stroke-dasharray="2,2"/>
  <text x="8" y="282" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">Fail open or fail closed is a per control decision, and it must be written down</text>
  <rect x="8" y="294" width="472" height="16" fill="#EFF3F7" rx="2"/>
  <text x="16" y="305" font-family="WPSans" font-size="6.6" fill="#8494A3" font-weight="bold">Control</text>
  <text x="210" y="305" font-family="WPSans" font-size="6.6" fill="#8494A3" font-weight="bold">Posture</text>
  <text x="286" y="305" font-family="WPSans" font-size="6.6" fill="#8494A3" font-weight="bold">Why</text>
  <line x1="8" y1="310" x2="480" y2="310" stroke="#E7ECF1" stroke-width="0.6"/>
  <text x="16" y="322" font-family="WPSans" font-size="6.5" fill="#26333F">Authentication and entitlement</text>
  <rect x="206" y="313" width="45.96" height="11.5" fill="#F9EAEA" rx="5.75"/>
  <text x="228.98" y="320.91" font-family="WPSans" font-size="6" fill="#9C2B2B" text-anchor="middle">fail closed</text>
  <text x="286" y="322" font-family="WPSans" font-size="6.4" fill="#5D6C7B">no identity, no answer</text>
  <line x1="8" y1="327" x2="480" y2="327" stroke="#E7ECF1" stroke-width="0.6"/>
  <text x="16" y="339" font-family="WPSans" font-size="6.5" fill="#26333F">Write authorization</text>
  <rect x="206" y="330" width="45.96" height="11.5" fill="#F9EAEA" rx="5.75"/>
  <text x="228.98" y="337.91" font-family="WPSans" font-size="6" fill="#9C2B2B" text-anchor="middle">fail closed</text>
  <text x="286" y="339" font-family="WPSans" font-size="6.4" fill="#5D6C7B">never infer authority from text</text>
  <line x1="8" y1="344" x2="480" y2="344" stroke="#E7ECF1" stroke-width="0.6"/>
  <text x="16" y="356" font-family="WPSans" font-size="6.5" fill="#26333F">Injection classifier</text>
  <rect x="206" y="347" width="45.96" height="11.5" fill="#F9EAEA" rx="5.75"/>
  <text x="228.98" y="354.91" font-family="WPSans" font-size="6" fill="#9C2B2B" text-anchor="middle">fail closed</text>
  <text x="286" y="356" font-family="WPSans" font-size="6.4" fill="#5D6C7B">on a read path, degrade to templates</text>
  <line x1="8" y1="361" x2="480" y2="361" stroke="#E7ECF1" stroke-width="0.6"/>
  <text x="16" y="373" font-family="WPSans" font-size="6.5" fill="#26333F">Groundedness judge, inline</text>
  <rect x="206" y="364" width="39.24" height="11.5" fill="#E4F1EF" rx="5.75"/>
  <text x="225.62" y="371.91" font-family="WPSans" font-size="6" fill="#0F7267" text-anchor="middle">fail open</text>
  <text x="286" y="373" font-family="WPSans" font-size="6.4" fill="#5D6C7B">log, sample, do not block the read</text>
  <line x1="8" y1="378" x2="480" y2="378" stroke="#E7ECF1" stroke-width="0.6"/>
  <text x="16" y="390" font-family="WPSans" font-size="6.5" fill="#26333F">Async quality judge</text>
  <rect x="206" y="381" width="39.24" height="11.5" fill="#E4F1EF" rx="5.75"/>
  <text x="225.62" y="388.91" font-family="WPSans" font-size="6" fill="#0F7267" text-anchor="middle">fail open</text>
  <text x="286" y="390" font-family="WPSans" font-size="6.4" fill="#5D6C7B">assurance is not availability</text>
  <line x1="8" y1="395" x2="480" y2="395" stroke="#E7ECF1" stroke-width="0.6"/>
  <text x="16" y="407" font-family="WPSans" font-size="6.5" fill="#26333F">Telemetry export</text>
  <rect x="206" y="398" width="39.24" height="11.5" fill="#E4F1EF" rx="5.75"/>
  <text x="225.62" y="405.91" font-family="WPSans" font-size="6" fill="#0F7267" text-anchor="middle">fail open</text>
  <text x="286" y="407" font-family="WPSans" font-size="6.4" fill="#5D6C7B">observability must not gate service</text>
  <line x1="8" y1="412" x2="480" y2="412" stroke="#D2DAE2" stroke-width="0.7"/>
