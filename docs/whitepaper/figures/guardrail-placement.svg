<svg xmlns="http://www.w3.org/2000/svg" width="488" height="422" viewBox="0 0 488 422">
  <text x="8" y="17" font-family="WPSans" font-size="7.4" fill="#16202B" font-weight="bold">Guardrails are placed where the trust boundary is, not where they are convenient to add</text>
  <rect x="8" y="40" width="62" height="30" fill="#EFF3F7" rx="3" stroke="#D2DAE2" stroke-width="1"/>
