  <text x="39" y="62.5" font-family="WPSans" font-size="6.8" fill="#16202B" text-anchor="middle" font-weight="bold">utterance</text>
  <rect x="90" y="40" width="62" height="30" fill="#E8F0F8" rx="3" stroke="#1C5A9E" stroke-width="1"/>
  <text x="121" y="52.5" font-family="WPSans" font-size="6.8" fill="#16202B" text-anchor="middle" font-weight="bold">Central</text>
  <text x="121" y="62.5" font-family="WPSans" font-size="6.8" fill="#16202B" text-anchor="middle" font-weight="bold">agent</text>
  <line x1="71" y1="55" x2="82.4" y2="55" stroke="#5D6C7B" stroke-width="1"/>
  <polygon points="87,55 82,57.3 82,52.7" fill="#5D6C7B"/>
  <rect x="172" y="40" width="62" height="30" fill="#E4F1EF" rx="3" stroke="#0F7267" stroke-width="1"/>
  <text x="203" y="52.5" font-family="WPSans" font-size="6.8" fill="#16202B" text-anchor="middle" font-weight="bold">Domain</text>
  <text x="203" y="62.5" font-family="WPSans" font-size="6.8" fill="#16202B" text-anchor="middle" font-weight="bold">capability</text>
  <line x1="153" y1="55" x2="164.4" y2="55" stroke="#5D6C7B" stroke-width="1"/>
  <polygon points="169,55 164,57.3 164,52.7" fill="#5D6C7B"/>
  <rect x="254" y="40" width="62" height="30" fill="#E4F1EF" rx="3" stroke="#0F7267" stroke-width="1"/>
  <text x="285" y="52.5" font-family="WPSans" font-size="6.8" fill="#16202B" text-anchor="middle" font-weight="bold">Tool and</text>
  <text x="285" y="62.5" font-family="WPSans" font-size="6.8" fill="#16202B" text-anchor="middle" font-weight="bold">retrieval</text>
  <line x1="235" y1="55" x2="246.4" y2="55" stroke="#5D6C7B" stroke-width="1"/>
  <polygon points="251,55 246,57.3 246,52.7" fill="#5D6C7B"/>
  <rect x="336" y="40" width="62" height="30" fill="#E8F0F8" rx="3" stroke="#1C5A9E" stroke-width="1"/>
  <text x="367" y="58.5" font-family="WPSans" font-size="6.8" fill="#16202B" text-anchor="middle" font-weight="bold">Compose</text>
  <line x1="317" y1="55" x2="328.4" y2="55" stroke="#5D6C7B" stroke-width="1"/>
  <polygon points="333,55 328,57.3 328,52.7" fill="#5D6C7B"/>
  <rect x="418" y="40" width="62" height="30" fill="#EFF3F7" rx="3" stroke="#D2DAE2" stroke-width="1"/>
  <text x="449" y="52.5" font-family="WPSans" font-size="6.8" fill="#16202B" text-anchor="middle" font-weight="bold">User</text>
  <text x="449" y="62.5" font-family="WPSans" font-size="6.8" fill="#16202B" text-anchor="middle" font-weight="bold">response</text>
  <line x1="399" y1="55" x2="410.4" y2="55" stroke="#5D6C7B" stroke-width="1"/>
  <polygon points="415,55 410,57.3 410,52.7" fill="#5D6C7B"/>
  <line x1="39" y1="72" x2="80.4196" y2="89.233" stroke="#A8551A" stroke-width="1.1"/>
  <polygon points="84.6667,91 79.1668,91.2029 80.9338,86.9558" fill="#A8551A"/>
  <rect x="8" y="94" width="153.333" height="92" fill="#FBF0E4" rx="3.5" stroke="#A8551A" stroke-width="1.1"/>
  <text x="16" y="108" font-family="WPSans" font-size="7.4" fill="#A8551A" font-weight="bold">Input rails</text>
  <text x="16" y="121" font-family="WPSans" font-size="6.3" fill="#A8551A">•</text>
  <text x="22" y="121" font-family="WPSans" font-size="6.3" fill="#26333F">prompt injection and jailbreak</text>
  <text x="16" y="130" font-family="WPSans" font-size="6.3" fill="#A8551A">•</text>
  <text x="22" y="130" font-family="WPSans" font-size="6.3" fill="#26333F">PII and secret detection</text>
  <text x="16" y="139" font-family="WPSans" font-size="6.3" fill="#A8551A">•</text>
  <text x="22" y="139" font-family="WPSans" font-size="6.3" fill="#26333F">topic and scope allow list</text>
  <text x="16" y="148" font-family="WPSans" font-size="6.3" fill="#A8551A">•</text>
  <text x="22" y="148" font-family="WPSans" font-size="6.3" fill="#26333F">length, encoding, rate abuse</text>
  <text x="16" y="179" font-family="WPSans" font-size="6.2" fill="#A8551A" font-style="italic">blocking, fail closed</text>
  <line x1="203" y1="72" x2="239.826" y2="89.0659" stroke="#9C2B2B" stroke-width="1.1"/>
  <polygon points="244,91 238.496,90.9845 240.431,86.8109" fill="#9C2B2B"/>
  <rect x="167.333" y="94" width="153.333" height="92" fill="#F9EAEA" rx="3.5" stroke="#9C2B2B" stroke-width="1.1"/>
  <text x="175.333" y="108" font-family="WPSans" font-size="7.4" fill="#9C2B2B" font-weight="bold">Tool and retrieval rails</text>
  <text x="175.333" y="121" font-family="WPSans" font-size="6.3" fill="#9C2B2B">•</text>
  <text x="181.333" y="121" font-family="WPSans" font-size="6.3" fill="#26333F">treat retrieved text as hostile</text>
  <text x="175.333" y="130" font-family="WPSans" font-size="6.3" fill="#9C2B2B">•</text>
  <text x="181.333" y="130" font-family="WPSans" font-size="6.3" fill="#26333F">tool argument schema and range</text>
  <text x="175.333" y="139" font-family="WPSans" font-size="6.3" fill="#9C2B2B">•</text>
  <text x="181.333" y="139" font-family="WPSans" font-size="6.3" fill="#26333F">entitlement scope per call</text>
  <text x="175.333" y="148" font-family="WPSans" font-size="6.3" fill="#9C2B2B">•</text>
  <text x="181.333" y="148" font-family="WPSans" font-size="6.3" fill="#26333F">no instruction lifting from data</text>
  <text x="175.333" y="179" font-family="WPSans" font-size="6.2" fill="#9C2B2B" font-style="italic">blocking, fail closed</text>
  <line x1="367" y1="72" x2="399.257" y2="88.8684" stroke="#5B4B9E" stroke-width="1.1"/>
  <polygon points="403.333,91 397.837,90.7211 399.968,86.6449" fill="#5B4B9E"/>
  <rect x="326.667" y="94" width="153.333" height="92" fill="#EDEAF7" rx="3.5" stroke="#5B4B9E" stroke-width="1.1"/>
  <text x="334.667" y="108" font-family="WPSans" font-size="7.4" fill="#5B4B9E" font-weight="bold">Output rails</text>
  <text x="334.667" y="121" font-family="WPSans" font-size="6.3" fill="#5B4B9E">•</text>
  <text x="340.667" y="121" font-family="WPSans" font-size="6.3" fill="#26333F">groundedness against sources</text>
  <text x="334.667" y="130" font-family="WPSans" font-size="6.3" fill="#5B4B9E">•</text>
  <text x="340.667" y="130" font-family="WPSans" font-size="6.3" fill="#26333F">PII and data class egress</text>
  <text x="334.667" y="139" font-family="WPSans" font-size="6.3" fill="#5B4B9E">•</text>
  <text x="340.667" y="139" font-family="WPSans" font-size="6.3" fill="#26333F">action assertion matches receipt</text>
  <text x="334.667" y="148" font-family="WPSans" font-size="6.3" fill="#5B4B9E">•</text>
  <text x="340.667" y="148" font-family="WPSans" font-size="6.3" fill="#26333F">schema and refusal correctness</text>
  <text x="334.667" y="179" font-family="WPSans" font-size="6.2" fill="#5B4B9E" font-style="italic">blocking, fail closed</text>
  <rect x="8" y="206" width="472" height="62" fill="#F7F9FB" rx="4" stroke="#E7ECF1" stroke-width="1"/>
  <text x="16" y="218.4" font-family="WPSans" font-size="7.6" fill="#8494A3" font-weight="bold">ASYNCHRONOUS ASSURANCE - never blocks the user</text>
  <text x="16" y="236" font-family="WPSans" font-size="6.9" fill="#16202B" font-weight="bold">Quality judges</text>
  <text x="16" y="246" font-family="WPSans" font-size="6.2" fill="#5D6C7B">LLM as judge on a sample,</text>
  <text x="16" y="254.6" font-family="WPSans" font-size="6.2" fill="#5D6C7B">own quota and queue</text>
  <text x="130" y="236" font-family="WPSans" font-size="6.9" fill="#16202B" font-weight="bold">Groundedness audit</text>
  <text x="130" y="246" font-family="WPSans" font-size="6.2" fill="#5D6C7B">deeper citation checking</text>
  <text x="130" y="254.6" font-family="WPSans" font-size="6.2" fill="#5D6C7B">than the inline rail</text>
  <text x="130" y="263.2" font-family="WPSans" font-size="6.2" fill="#5D6C7B">affords</text>
  <text x="244" y="236" font-family="WPSans" font-size="6.9" fill="#16202B" font-weight="bold">Drift and slice watch</text>
  <text x="244" y="246" font-family="WPSans" font-size="6.2" fill="#5D6C7B">per domain, per journey,</text>
  <text x="244" y="254.6" font-family="WPSans" font-size="6.2" fill="#5D6C7B">per release cohort</text>
  <text x="358" y="236" font-family="WPSans" font-size="6.9" fill="#16202B" font-weight="bold">Red team replay</text>
  <text x="358" y="246" font-family="WPSans" font-size="6.2" fill="#5D6C7B">adversarial corpus against</text>
  <text x="358" y="254.6" font-family="WPSans" font-size="6.2" fill="#5D6C7B">the current manifest</text>
