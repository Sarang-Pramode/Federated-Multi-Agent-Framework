<svg xmlns="http://www.w3.org/2000/svg" width="488" height="363" viewBox="0 0 488 363">
  <text x="8" y="17" font-family="WPSans" font-size="7.4" fill="#16202B" font-weight="bold">The twelve demonstration steps, and the architectural claim each one makes falsifiable</text>
  <rect x="8" y="28" width="472" height="17" fill="#EFF3F7" rx="2"/>
  <text x="15" y="39.6" font-family="WPSans" font-size="6.4" fill="#8494A3" font-weight="bold">Step</text>
  <text x="46" y="39.6" font-family="WPSans" font-size="6.4" fill="#8494A3" font-weight="bold">What the demo shows</text>
  <text x="160" y="39.6" font-family="WPSans" font-size="6.4" fill="#8494A3" font-weight="bold">Artefact in the prototype</text>
  <text x="304" y="39.6" font-family="WPSans" font-size="6.4" fill="#8494A3" font-weight="bold">The claim it makes testable</text>
  <rect x="8" y="45" width="472" height="21" fill="#FFFFFF" rx="1.6"/>
  <rect x="8" y="46" width="2.4" height="19" fill="#5D6C7B" rx="1.2"/>
  <circle cx="24" cy="55.5" r="6.2" fill="#5D6C7B"/>
  <text x="24" y="58" font-family="WPSans" font-size="6.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
  <text x="38" y="58" font-family="WPSans" font-size="6.5" fill="#16202B" font-weight="bold">Central platform only</text>
  <text x="160" y="58" font-family="WPSans" font-size="6.2" fill="#5D6C7B">no domain connected, 48 ms degraded trace</text>
  <text x="304" y="58" font-family="WPSans" font-size="6.2" fill="#26333F">the centre holds no domain capability</text>
  <rect x="8" y="66" width="472" height="21" fill="#F7F9FB" rx="1.6"/>
  <rect x="8" y="67" width="2.4" height="19" fill="#1C5A9E" rx="1.2"/>
  <circle cx="24" cy="76.5" r="6.2" fill="#1C5A9E"/>
  <text x="24" y="79" font-family="WPSans" font-size="6.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
  <text x="38" y="79" font-family="WPSans" font-size="6.5" fill="#16202B" font-weight="bold">Rewards discovered</text>
  <text x="160" y="79" font-family="WPSans" font-size="6.2" fill="#5D6C7B">m-rew-10, prompt 8ab1, A2A v1.0</text>
  <text x="304" y="79" font-family="WPSans" font-size="6.2" fill="#26333F">capability is discovered, not shipped</text>
  <rect x="8" y="87" width="472" height="21" fill="#FFFFFF" rx="1.6"/>
  <rect x="8" y="88" width="2.4" height="19" fill="#1C5A9E" rx="1.2"/>
  <circle cx="24" cy="97.5" r="6.2" fill="#1C5A9E"/>
  <text x="24" y="100" font-family="WPSans" font-size="6.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
  <text x="38" y="100" font-family="WPSans" font-size="6.5" fill="#16202B" font-weight="bold">Same question, new answer</text>
  <text x="160" y="100" font-family="WPSans" font-size="6.2" fill="#5D6C7B">routes to get_points_balance</text>
  <text x="304" y="100" font-family="WPSans" font-size="6.2" fill="#26333F">capability grows with no central release</text>
  <rect x="8" y="108" width="472" height="21" fill="#F7F9FB" rx="1.6"/>
  <rect x="8" y="109" width="2.4" height="19" fill="#1C5A9E" rx="1.2"/>
  <circle cx="24" cy="118.5" r="6.2" fill="#1C5A9E"/>
  <text x="24" y="121" font-family="WPSans" font-size="6.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
  <text x="38" y="121" font-family="WPSans" font-size="6.5" fill="#16202B" font-weight="bold">Transactions discovered</text>
  <text x="160" y="121" font-family="WPSans" font-size="6.2" fill="#5D6C7B">m-txn-10, same onboarding gate</text>
  <text x="304" y="121" font-family="WPSans" font-size="6.2" fill="#26333F">the gate is a rule, not a favour</text>
  <rect x="8" y="129" width="472" height="21" fill="#FFFFFF" rx="1.6"/>
  <rect x="8" y="130" width="2.4" height="19" fill="#0F7267" rx="1.2"/>
  <circle cx="24" cy="139.5" r="6.2" fill="#0F7267"/>
  <text x="24" y="142" font-family="WPSans" font-size="6.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
  <text x="38" y="142" font-family="WPSans" font-size="6.5" fill="#16202B" font-weight="bold">Cross domain journey</text>
  <text x="160" y="142" font-family="WPSans" font-size="6.2" fill="#5D6C7B">T1001, $100, restaurant 3x, 300 points</text>
  <text x="304" y="142" font-family="WPSans" font-size="6.2" fill="#26333F">the centre composes, domains stay decoupled</text>
  <rect x="8" y="150" width="472" height="21" fill="#F7F9FB" rx="1.6"/>
  <rect x="8" y="151" width="2.4" height="19" fill="#5B4B9E" rx="1.2"/>
  <circle cx="24" cy="160.5" r="6.2" fill="#5B4B9E"/>
  <text x="24" y="163" font-family="WPSans" font-size="6.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text>
  <text x="38" y="163" font-family="WPSans" font-size="6.5" fill="#16202B" font-weight="bold">Prompt change detected</text>
  <text x="160" y="163" font-family="WPSans" font-size="6.2" fill="#5D6C7B">8ab1 to 91fd by snapshot diff</text>
  <text x="304" y="163" font-family="WPSans" font-size="6.2" fill="#26333F">the platform detects change, not the author</text>
  <rect x="8" y="171" width="472" height="21" fill="#FFFFFF" rx="1.6"/>
  <rect x="8" y="172" width="2.4" height="19" fill="#9C2B2B" rx="1.2"/>
  <circle cx="24" cy="181.5" r="6.2" fill="#9C2B2B"/>
  <text x="24" y="184" font-family="WPSans" font-size="6.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">7</text>
  <text x="38" y="184" font-family="WPSans" font-size="6.5" fill="#16202B" font-weight="bold">Regression caught</text>
  <text x="160" y="184" font-family="WPSans" font-size="6.2" fill="#5D6C7B">case c13 expected 300, observed 200</text>
  <text x="304" y="184" font-family="WPSans" font-size="6.2" fill="#26333F">targeted evidence catches a real defect</text>
  <rect x="8" y="192" width="472" height="21" fill="#F7F9FB" rx="1.6"/>
  <rect x="8" y="193" width="2.4" height="19" fill="#0F7267" rx="1.2"/>
  <circle cx="24" cy="202.5" r="6.2" fill="#0F7267"/>
  <text x="24" y="205" font-family="WPSans" font-size="6.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">8</text>
  <text x="38" y="205" font-family="WPSans" font-size="6.5" fill="#16202B" font-weight="bold">Repair certified</text>
  <text x="160" y="205" font-family="WPSans" font-size="6.2" fill="#5D6C7B">91fd to c3e4, 18 of 18 pass</text>
  <text x="304" y="205" font-family="WPSans" font-size="6.2" fill="#26333F">the same loop certifies the repair</text>
  <rect x="8" y="213" width="472" height="21" fill="#FFFFFF" rx="1.6"/>
  <rect x="8" y="214" width="2.4" height="19" fill="#0F7267" rx="1.2"/>
  <circle cx="24" cy="223.5" r="6.2" fill="#0F7267"/>
  <text x="24" y="226" font-family="WPSans" font-size="6.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">9</text>
  <text x="38" y="226" font-family="WPSans" font-size="6.5" fill="#16202B" font-weight="bold">Tool added</text>
  <text x="160" y="226" font-family="WPSans" font-size="6.2" fill="#5D6C7B">get_expiring_points, schema t2e9</text>
  <text x="304" y="226" font-family="WPSans" font-size="6.2" fill="#26333F">the registry expands without central edits</text>
  <rect x="8" y="234" width="472" height="21" fill="#F7F9FB" rx="1.6"/>
  <rect x="8" y="235" width="2.4" height="19" fill="#0F7267" rx="1.2"/>
  <circle cx="24" cy="244.5" r="6.2" fill="#0F7267"/>
  <text x="24" y="247" font-family="WPSans" font-size="6.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">10</text>
  <text x="38" y="247" font-family="WPSans" font-size="6.5" fill="#16202B" font-weight="bold">Skill added</text>
  <text x="160" y="247" font-family="WPSans" font-size="6.2" fill="#5D6C7B">expiring_points skill, m-rew-12</text>
  <text x="304" y="247" font-family="WPSans" font-size="6.2" fill="#26333F">one domain ships new customer capability</text>
  <rect x="8" y="255" width="472" height="21" fill="#FFFFFF" rx="1.6"/>
  <rect x="8" y="256" width="2.4" height="19" fill="#9C2B2B" rx="1.2"/>
  <circle cx="24" cy="265.5" r="6.2" fill="#9C2B2B"/>
  <text x="24" y="268" font-family="WPSans" font-size="6.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">11</text>
  <text x="38" y="268" font-family="WPSans" font-size="6.5" fill="#16202B" font-weight="bold">Domain failure</text>
  <text x="160" y="268" font-family="WPSans" font-size="6.2" fill="#5D6C7B">Rewards span errors at 12 ms</text>
  <text x="304" y="268" font-family="WPSans" font-size="6.2" fill="#26333F">failure is contained and named</text>
  <rect x="8" y="276" width="472" height="21" fill="#F7F9FB" rx="1.6"/>
  <rect x="8" y="277" width="2.4" height="19" fill="#5B4B9E" rx="1.2"/>
  <circle cx="24" cy="286.5" r="6.2" fill="#5B4B9E"/>
  <text x="24" y="289" font-family="WPSans" font-size="6.4" fill="#FFFFFF" text-anchor="middle" font-weight="bold">12</text>
  <text x="38" y="289" font-family="WPSans" font-size="6.5" fill="#16202B" font-weight="bold">Attested summary</text>
  <text x="160" y="289" font-family="WPSans" font-size="6.2" fill="#5D6C7B">reachability-closed, verdict ATTESTED</text>
  <text x="304" y="289" font-family="WPSans" font-size="6.2" fill="#26333F">reachable surface equals published bundle</text>
  <rect x="8" y="307" width="472" height="46" fill="#E8F0F8" rx="3" stroke="#1C5A9E" stroke-width="1"/>
  <text x="16" y="321" font-family="WPSans" font-size="7" fill="#123F72" font-weight="bold">What the prototype does not prove</text>
  <text x="16" y="333" font-family="WPSans" font-size="6.4" fill="#26333F">The demonstration is a deterministic replay of recorded events, not a load test. It establishes that the control surfaces exist</text>
  <text x="16" y="342" font-family="WPSans" font-size="6.4" fill="#26333F">and that the seams are in the right places. Every latency and throughput figure in Part IV is third-party or modelled, and</text>
  <text x="16" y="351" font-family="WPSans" font-size="6.4" fill="#26333F">must be re-measured against your own workload before it is used to buy hardware.</text>
  <rect x="0.5" y="0.5" width="487" height="362" fill="none" rx="3" stroke="#E7ECF1" stroke-width="1"/>
</svg>
