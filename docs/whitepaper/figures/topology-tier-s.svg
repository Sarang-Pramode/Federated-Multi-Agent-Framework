<svg xmlns="http://www.w3.org/2000/svg" width="488" height="386.2" viewBox="0 0 488 386.2">
  <rect x="8" y="8" width="472" height="24" fill="#0F7267" rx="3"/>
  <text x="18" y="24" font-family="WPSans" font-size="9" fill="#FFFFFF" font-weight="bold">TIER S</text>
  <text x="74" y="24" font-family="WPSans" font-size="8.2" fill="#FFFFFF">Fewer than 10 customers</text>
  <text x="470" y="24" font-family="WPSans" font-size="7" fill="#FFFFFF" text-anchor="end">pilot, design partner, internal beta</text>
  <text x="8" y="51" font-family="WPSans" font-size="6.8" fill="#8494A3" font-weight="bold">Single inference node</text>
  <rect x="8" y="57" width="233" height="58.8" fill="#E4F1EF" rx="3" stroke="#0F7267" stroke-width="1"/>
  <rect x="8" y="58" width="2.6" height="56.8" fill="#0F7267" rx="1.3"/>
  <text x="17" y="70" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">GPU 0</text>
  <text x="17" y="80" font-family="WPSans" font-size="6.3" fill="#5D6C7B">1 x RTX PRO 6000 Blackwell, 96 GB</text>
  <text x="17" y="91" font-family="WPSans" font-size="6.2" fill="#26333F">Tier 1 router, 4B, FP8</text>
  <text x="17" y="100.6" font-family="WPSans" font-size="6.2" fill="#26333F">guard classifier, 86M</text>
  <text x="17" y="110.2" font-family="WPSans" font-size="6.2" fill="#26333F">Tier 2 synthesis, 8B, FP8</text>
  <rect x="247" y="57" width="233" height="58.8" fill="#FFFFFF" rx="3" stroke="#D2DAE2" stroke-width="1"/>
  <rect x="247" y="58" width="2.6" height="56.8" fill="#D2DAE2" rx="1.3"/>
  <text x="256" y="70" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">Host</text>
  <text x="256" y="80" font-family="WPSans" font-size="6.3" fill="#5D6C7B">32 vCPU, 256 GB RAM, NVMe</text>
  <text x="256" y="91" font-family="WPSans" font-size="6.2" fill="#26333F">vLLM, two served models</text>
  <text x="256" y="100.6" font-family="WPSans" font-size="6.2" fill="#26333F">registry and session in Postgres</text>
  <text x="256" y="110.2" font-family="WPSans" font-size="6.2" fill="#26333F">traces to a local collector</text>
  <text x="8" y="134.8" font-family="WPSans" font-size="6.8" fill="#8494A3" font-weight="bold">Off node</text>
  <rect x="8" y="140.8" width="153.333" height="49.2" fill="#EDEAF7" rx="3" stroke="#5B4B9E" stroke-width="1"/>
  <rect x="8" y="141.8" width="2.6" height="47.2" fill="#5B4B9E" rx="1.3"/>
  <text x="17" y="153.8" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">Frontier tier</text>
  <text x="17" y="163.8" font-family="WPSans" font-size="6.3" fill="#5D6C7B">API, pay as you go</text>
  <text x="17" y="174.8" font-family="WPSans" font-size="6.2" fill="#26333F">Tier 3 planning only</text>
  <text x="17" y="184.4" font-family="WPSans" font-size="6.2" fill="#26333F">no reserved capacity yet</text>
  <rect x="167.333" y="140.8" width="153.333" height="39.6" fill="#EFF3F7" rx="3" stroke="#5D6C7B" stroke-width="1"/>
  <rect x="167.333" y="141.8" width="2.6" height="37.6" fill="#5D6C7B" rx="1.3"/>
  <text x="176.333" y="153.8" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">Judges</text>
  <text x="176.333" y="163.8" font-family="WPSans" font-size="6.3" fill="#5D6C7B">API, batch overnight</text>
  <text x="176.333" y="174.8" font-family="WPSans" font-size="6.2" fill="#26333F">eval runs, not live sampling</text>
  <rect x="326.667" y="140.8" width="153.333" height="39.6" fill="#FFFFFF" rx="3" stroke="#D2DAE2" stroke-width="1"/>
  <rect x="326.667" y="141.8" width="2.6" height="37.6" fill="#D2DAE2" rx="1.3"/>
  <text x="335.667" y="153.8" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">Domains</text>
  <text x="335.667" y="163.8" font-family="WPSans" font-size="6.3" fill="#5D6C7B">existing services</text>
  <text x="335.667" y="174.8" font-family="WPSans" font-size="6.2" fill="#26333F">no new hardware</text>
  <line x1="8" y1="202" x2="480" y2="202" stroke="#E7ECF1" stroke-width="0.8"/>
  <text x="8" y="215" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">Sizing arithmetic</text>
  <text x="14" y="226" font-family="WPSans" font-size="6.5" fill="#5D6C7B">Peak concurrent sessions</text>
  <text x="474" y="226" font-family="WPSans" font-size="6.5" fill="#16202B" text-anchor="end" font-weight="bold">under 40</text>
  <line x1="14" y1="229.2" x2="474" y2="229.2" stroke="#E7ECF1" stroke-width="0.5"/>
  <text x="14" y="238.5" font-family="WPSans" font-size="6.5" fill="#5D6C7B">In flight requests at peak</text>
  <text x="474" y="238.5" font-family="WPSans" font-size="6.5" fill="#16202B" text-anchor="end" font-weight="bold">3 to 6</text>
  <line x1="14" y1="241.7" x2="474" y2="241.7" stroke="#E7ECF1" stroke-width="0.5"/>
  <text x="14" y="251" font-family="WPSans" font-size="6.5" fill="#5D6C7B">Control path calls per second</text>
  <text x="474" y="251" font-family="WPSans" font-size="6.5" fill="#16202B" text-anchor="end" font-weight="bold">8 to 15</text>
  <line x1="14" y1="254.2" x2="474" y2="254.2" stroke="#E7ECF1" stroke-width="0.5"/>
  <text x="14" y="263.5" font-family="WPSans" font-size="6.5" fill="#5D6C7B">Control path tokens per second</text>
  <text x="474" y="263.5" font-family="WPSans" font-size="6.5" fill="#16202B" text-anchor="end" font-weight="bold">1,500 to 3,000</text>
  <line x1="14" y1="266.7" x2="474" y2="266.7" stroke="#E7ECF1" stroke-width="0.5"/>
  <text x="14" y="276" font-family="WPSans" font-size="6.5" fill="#5D6C7B">GPU count, steady state</text>
  <text x="474" y="276" font-family="WPSans" font-size="6.5" fill="#16202B" text-anchor="end" font-weight="bold">1</text>
  <line x1="14" y1="279.2" x2="474" y2="279.2" stroke="#E7ECF1" stroke-width="0.5"/>
  <text x="14" y="288.5" font-family="WPSans" font-size="6.5" fill="#5D6C7B">Utilisation target</text>
  <text x="474" y="288.5" font-family="WPSans" font-size="6.5" fill="#16202B" text-anchor="end" font-weight="bold">20 to 35% - headroom is the point</text>
  <line x1="14" y1="291.7" x2="474" y2="291.7" stroke="#E7ECF1" stroke-width="0.5"/>
  <rect x="8" y="307" width="472" height="69.2" fill="#F7F9FB" rx="3" stroke="#E7ECF1" stroke-width="0.9"/>
  <text x="15" y="321" font-family="WPSans" font-size="6.3" fill="#0F7267">•</text>
  <text x="22" y="321" font-family="WPSans" font-size="6.4" fill="#26333F">One GPU is a single point of failure. Accept it here, but write the degraded mode down: deterministic routing plus templated</text>
  <text x="22" y="330.6" font-family="WPSans" font-size="6.4" fill="#26333F">answers when the node is gone.</text>
  <text x="15" y="342.6" font-family="WPSans" font-size="6.3" fill="#0F7267">•</text>
  <text x="22" y="342.6" font-family="WPSans" font-size="6.4" fill="#26333F">Do not buy HBM-class hardware at this tier. You are buying the ability to measure your own workload, not throughput you cannot</text>
  <text x="22" y="352.2" font-family="WPSans" font-size="6.4" fill="#26333F">yet use.</text>
  <text x="15" y="364.2" font-family="WPSans" font-size="6.3" fill="#0F7267">•</text>
  <text x="22" y="364.2" font-family="WPSans" font-size="6.4" fill="#26333F">The expensive mistake at Tier S is skipping telemetry. Without per-stage traces you will size Tier M from guesses.</text>
  <rect x="0.5" y="0.5" width="487" height="385.2" fill="none" rx="3" stroke="#E7ECF1" stroke-width="1"/>
</svg>
