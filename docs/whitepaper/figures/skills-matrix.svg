  <text x="16" y="438" font-family="WPSans" font-size="6.4" fill="#26333F">One ML generalist owning serving, quantization, evals, safety</text>
  <text x="16" y="447.4" font-family="WPSans" font-size="6.4" fill="#26333F">and cost. It works in the pilot, becomes the bus factor in</text>
  <text x="16" y="456.8" font-family="WPSans" font-size="6.4" fill="#26333F">production, and the first thing dropped is always evaluation.</text>
  <rect x="247" y="411" width="233" height="70" fill="#E4F1EF" rx="3" stroke="#0F7267" stroke-width="1"/>
  <text x="255" y="425" font-family="WPSans" font-size="7" fill="#0F7267" font-weight="bold">A defensible build order</text>
  <text x="255" y="438" font-family="WPSans" font-size="6.3" fill="#26333F">1. eval engineering, before any model choice</text>
  <text x="255" y="446.6" font-family="WPSans" font-size="6.3" fill="#26333F">2. serving and observability, then quantization</text>
  <text x="255" y="455.2" font-family="WPSans" font-size="6.3" fill="#26333F">3. safety and rail tuning as traffic grows</text>
  <text x="255" y="463.8" font-family="WPSans" font-size="6.3" fill="#26333F">4. distillation and fine-tuning last, when the</text>
  <text x="255" y="472.4" font-family="WPSans" font-size="6.3" fill="#26333F">    workload is stable enough to be worth it</text>
  <rect x="0.5" y="0.5" width="487" height="490" fill="none" rx="3" stroke="#E7ECF1" stroke-width="1"/>
</svg>
