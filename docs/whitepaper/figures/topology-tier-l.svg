<svg xmlns="http://www.w3.org/2000/svg" width="488" height="410.7" viewBox="0 0 488 410.7">
  <rect x="8" y="8" width="472" height="24" fill="#5B4B9E" rx="3"/>
  <text x="18" y="24" font-family="WPSans" font-size="9" fill="#FFFFFF" font-weight="bold">TIER L</text>
  <text x="74" y="24" font-family="WPSans" font-size="8.2" fill="#FFFFFF">More than 50,000 concurrent sessions</text>
  <text x="470" y="24" font-family="WPSans" font-size="7" fill="#FFFFFF" text-anchor="end">multi region, disaggregated</text>
  <text x="8" y="51" font-family="WPSans" font-size="6.8" fill="#8494A3" font-weight="bold">Per region cell - the unit you replicate, not the thing you grow</text>
  <rect x="8" y="57" width="153.333" height="49.2" fill="#E8F0F8" rx="3" stroke="#1C5A9E" stroke-width="1"/>
  <rect x="8" y="58" width="2.6" height="47.2" fill="#1C5A9E" rx="1.3"/>
  <text x="17" y="70" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">Prefill nodes</text>
  <text x="17" y="80" font-family="WPSans" font-size="6.3" fill="#5D6C7B">8 x B200, NVFP4</text>
  <text x="17" y="91" font-family="WPSans" font-size="6.2" fill="#26333F">compute bound, long inputs</text>
  <text x="17" y="100.6" font-family="WPSans" font-size="6.2" fill="#26333F">scales with prompt length</text>
  <rect x="167.333" y="57" width="153.333" height="49.2" fill="#E4F1EF" rx="3" stroke="#0F7267" stroke-width="1"/>
  <rect x="167.333" y="58" width="2.6" height="47.2" fill="#0F7267" rx="1.3"/>
  <text x="176.333" y="70" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">Decode nodes</text>
  <text x="176.333" y="80" font-family="WPSans" font-size="6.3" fill="#5D6C7B">16 x H200 or B200</text>
  <text x="176.333" y="91" font-family="WPSans" font-size="6.2" fill="#26333F">bandwidth bound, KV resident</text>
  <text x="176.333" y="100.6" font-family="WPSans" font-size="6.2" fill="#26333F">scales with concurrency</text>
  <rect x="326.667" y="57" width="153.333" height="49.2" fill="#EFF3F7" rx="3" stroke="#5D6C7B" stroke-width="1"/>
  <rect x="326.667" y="58" width="2.6" height="47.2" fill="#5D6C7B" rx="1.3"/>
  <text x="335.667" y="70" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">KV transfer</text>
  <text x="335.667" y="80" font-family="WPSans" font-size="6.3" fill="#5D6C7B">NVLink and RDMA fabric</text>
  <text x="335.667" y="91" font-family="WPSans" font-size="6.2" fill="#26333F">prefill to decode handoff</text>
  <text x="335.667" y="100.6" font-family="WPSans" font-size="6.2" fill="#26333F">the new failure domain</text>
  <text x="8" y="125.2" font-family="WPSans" font-size="6.8" fill="#8494A3" font-weight="bold">Shared and global</text>
  <rect x="8" y="131.2" width="113.5" height="39.6" fill="#FBF0E4" rx="3" stroke="#A8551A" stroke-width="1"/>
  <rect x="8" y="132.2" width="2.6" height="37.6" fill="#A8551A" rx="1.3"/>
  <text x="17" y="144.2" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">Guard fleet</text>
  <text x="17" y="154.2" font-family="WPSans" font-size="6.3" fill="#5D6C7B">6 x L40S per region</text>
  <text x="17" y="165.2" font-family="WPSans" font-size="6.2" fill="#26333F">rails scale with turns</text>
  <rect x="127.5" y="131.2" width="113.5" height="39.6" fill="#EFF3F7" rx="3" stroke="#5D6C7B" stroke-width="1"/>
  <rect x="127.5" y="132.2" width="2.6" height="37.6" fill="#5D6C7B" rx="1.3"/>
  <text x="136.5" y="144.2" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">Judge fleet</text>
  <text x="136.5" y="154.2" font-family="WPSans" font-size="6.3" fill="#5D6C7B">8 x L40S, global</text>
  <text x="136.5" y="165.2" font-family="WPSans" font-size="6.2" fill="#26333F">batch, off peak, own budget</text>
  <rect x="247" y="131.2" width="113.5" height="39.6" fill="#EDEAF7" rx="3" stroke="#5B4B9E" stroke-width="1"/>
  <rect x="247" y="132.2" width="2.6" height="37.6" fill="#5B4B9E" rx="1.3"/>
  <text x="256" y="144.2" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">Frontier tier</text>
  <text x="256" y="154.2" font-family="WPSans" font-size="6.3" fill="#5D6C7B">provisioned throughput</text>
  <text x="256" y="165.2" font-family="WPSans" font-size="6.2" fill="#26333F">committed, not on demand</text>
  <rect x="366.5" y="131.2" width="113.5" height="39.6" fill="#FFFFFF" rx="3" stroke="#D2DAE2" stroke-width="1"/>
  <rect x="366.5" y="132.2" width="2.6" height="37.6" fill="#D2DAE2" rx="1.3"/>
  <text x="375.5" y="144.2" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">Control plane</text>
  <text x="375.5" y="154.2" font-family="WPSans" font-size="6.3" fill="#5D6C7B">replicated, regional cache</text>
  <text x="375.5" y="165.2" font-family="WPSans" font-size="6.2" fill="#26333F">registry must survive a region</text>
  <line x1="8" y1="182.8" x2="480" y2="182.8" stroke="#E7ECF1" stroke-width="0.8"/>
  <text x="8" y="195.8" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">Sizing arithmetic</text>
  <text x="14" y="206.8" font-family="WPSans" font-size="6.5" fill="#5D6C7B">Peak concurrent sessions</text>
  <text x="474" y="206.8" font-family="WPSans" font-size="6.5" fill="#16202B" text-anchor="end" font-weight="bold">50,000 plus</text>
  <line x1="14" y1="210" x2="474" y2="210" stroke="#E7ECF1" stroke-width="0.5"/>
  <text x="14" y="219.3" font-family="WPSans" font-size="6.5" fill="#5D6C7B">In flight requests at peak</text>
  <text x="474" y="219.3" font-family="WPSans" font-size="6.5" fill="#16202B" text-anchor="end" font-weight="bold">about 4,400</text>
  <line x1="14" y1="222.5" x2="474" y2="222.5" stroke="#E7ECF1" stroke-width="0.5"/>
  <text x="14" y="231.8" font-family="WPSans" font-size="6.5" fill="#5D6C7B">Control path calls per second</text>
  <text x="474" y="231.8" font-family="WPSans" font-size="6.5" fill="#16202B" text-anchor="end" font-weight="bold">about 5,200</text>
  <line x1="14" y1="235" x2="474" y2="235" stroke="#E7ECF1" stroke-width="0.5"/>
  <text x="14" y="244.3" font-family="WPSans" font-size="6.5" fill="#5D6C7B">Control path tokens per second</text>
  <text x="474" y="244.3" font-family="WPSans" font-size="6.5" fill="#16202B" text-anchor="end" font-weight="bold">about 1,040,000</text>
  <line x1="14" y1="247.5" x2="474" y2="247.5" stroke="#E7ECF1" stroke-width="0.5"/>
  <text x="14" y="256.8" font-family="WPSans" font-size="6.5" fill="#5D6C7B">Regions</text>
  <text x="474" y="256.8" font-family="WPSans" font-size="6.5" fill="#16202B" text-anchor="end" font-weight="bold">3, each sized for 2 of 3 surviving</text>
  <line x1="14" y1="260" x2="474" y2="260" stroke="#E7ECF1" stroke-width="0.5"/>
  <text x="14" y="269.3" font-family="WPSans" font-size="6.5" fill="#5D6C7B">GPU count per region</text>
  <text x="474" y="269.3" font-family="WPSans" font-size="6.5" fill="#16202B" text-anchor="end" font-weight="bold">about 30 plus spares</text>
  <line x1="14" y1="272.5" x2="474" y2="272.5" stroke="#E7ECF1" stroke-width="0.5"/>
  <text x="14" y="281.8" font-family="WPSans" font-size="6.5" fill="#5D6C7B">Utilisation target, decode</text>
  <text x="474" y="281.8" font-family="WPSans" font-size="6.5" fill="#16202B" text-anchor="end" font-weight="bold">60 to 75% with admission control</text>
  <line x1="14" y1="285" x2="474" y2="285" stroke="#E7ECF1" stroke-width="0.5"/>
  <rect x="8" y="300.3" width="472" height="100.4" fill="#F7F9FB" rx="3" stroke="#E7ECF1" stroke-width="0.9"/>
  <text x="15" y="314.3" font-family="WPSans" font-size="6.3" fill="#5B4B9E">•</text>
  <text x="22" y="314.3" font-family="WPSans" font-size="6.4" fill="#26333F">Disaggregating prefill from decode stops long prompts from stalling the decode queue. It is worth the fabric complexity only</text>
  <text x="22" y="323.9" font-family="WPSans" font-size="6.4" fill="#26333F">once one pool is clearly starving the other - measure before you split.</text>
  <text x="15" y="335.9" font-family="WPSans" font-size="6.3" fill="#5B4B9E">•</text>
  <text x="22" y="335.9" font-family="WPSans" font-size="6.4" fill="#26333F">At this scale the control plane, not the GPUs, is the availability risk. A registry outage that blocks routing takes every</text>
  <text x="22" y="345.5" font-family="WPSans" font-size="6.4" fill="#26333F">region down at once; regional last-known-good caches and static routes for critical journeys are mandatory.</text>
  <text x="15" y="357.5" font-family="WPSans" font-size="6.3" fill="#5B4B9E">•</text>
  <text x="22" y="357.5" font-family="WPSans" font-size="6.4" fill="#26333F">Capacity is bought in cells. Growth adds cells with known behaviour rather than enlarging one pool whose tail latency degrades</text>
  <text x="22" y="367.1" font-family="WPSans" font-size="6.4" fill="#26333F">non-linearly.</text>
  <text x="15" y="379.1" font-family="WPSans" font-size="6.3" fill="#5B4B9E">•</text>
  <text x="22" y="379.1" font-family="WPSans" font-size="6.4" fill="#26333F">Judge and shadow traffic must have a hard budget. At 50,000 concurrent sessions, 10% sampling is a larger workload than most</text>
  <text x="22" y="388.7" font-family="WPSans" font-size="6.4" fill="#26333F">Tier M deployments serve in total.</text>
  <rect x="0.5" y="0.5" width="487" height="409.7" fill="none" rx="3" stroke="#E7ECF1" stroke-width="1"/>
</svg>
