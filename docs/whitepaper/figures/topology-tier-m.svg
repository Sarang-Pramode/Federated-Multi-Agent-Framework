<svg xmlns="http://www.w3.org/2000/svg" width="488" height="408.3" viewBox="0 0 488 408.3">
  <rect x="8" y="8" width="472" height="24" fill="#1C5A9E" rx="3"/>
  <text x="18" y="24" font-family="WPSans" font-size="9" fill="#FFFFFF" font-weight="bold">TIER M</text>
  <text x="74" y="24" font-family="WPSans" font-size="8.2" fill="#FFFFFF">1,000 to 5,000 concurrent sessions</text>
  <text x="470" y="24" font-family="WPSans" font-size="7" fill="#FFFFFF" text-anchor="end">regional production</text>
  <text x="8" y="51" font-family="WPSans" font-size="6.8" fill="#8494A3" font-weight="bold">Fast tier pool - latency critical, scaled for p99</text>
  <rect x="8" y="57" width="153.333" height="58.8" fill="#E4F1EF" rx="3" stroke="#0F7267" stroke-width="1"/>
  <rect x="8" y="58" width="2.6" height="56.8" fill="#0F7267" rx="1.3"/>
  <text x="17" y="70" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">Router pool</text>
  <text x="17" y="80" font-family="WPSans" font-size="6.3" fill="#5D6C7B">3 x L40S or RTX PRO 6000</text>
  <text x="17" y="91" font-family="WPSans" font-size="6.2" fill="#26333F">Tier 1, 4B, FP8</text>
  <text x="17" y="100.6" font-family="WPSans" font-size="6.2" fill="#26333F">one node may fail</text>
  <text x="17" y="110.2" font-family="WPSans" font-size="6.2" fill="#26333F">pinned, never preempted</text>
  <rect x="167.333" y="57" width="153.333" height="49.2" fill="#FBF0E4" rx="3" stroke="#A8551A" stroke-width="1"/>
  <rect x="167.333" y="58" width="2.6" height="47.2" fill="#A8551A" rx="1.3"/>
  <text x="176.333" y="70" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">Guard pool</text>
  <text x="176.333" y="80" font-family="WPSans" font-size="6.3" fill="#5D6C7B">2 x L40S</text>
  <text x="176.333" y="91" font-family="WPSans" font-size="6.2" fill="#26333F">86M classifier, 8B guard</text>
  <text x="176.333" y="100.6" font-family="WPSans" font-size="6.2" fill="#26333F">isolated from user traffic</text>
  <rect x="326.667" y="57" width="153.333" height="49.2" fill="#E8F0F8" rx="3" stroke="#1C5A9E" stroke-width="1"/>
  <rect x="326.667" y="58" width="2.6" height="47.2" fill="#1C5A9E" rx="1.3"/>
  <text x="335.667" y="70" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">Synthesis pool</text>
  <text x="335.667" y="80" font-family="WPSans" font-size="6.3" fill="#5D6C7B">4 x H100 or H200</text>
  <text x="335.667" y="91" font-family="WPSans" font-size="6.2" fill="#26333F">Tier 2, 8-32B, FP8</text>
  <text x="335.667" y="100.6" font-family="WPSans" font-size="6.2" fill="#26333F">continuous batching</text>
  <text x="8" y="134.8" font-family="WPSans" font-size="6.8" fill="#8494A3" font-weight="bold">Assurance and durable tiers - throughput, not latency</text>
  <rect x="8" y="140.8" width="153.333" height="49.2" fill="#EFF3F7" rx="3" stroke="#5D6C7B" stroke-width="1"/>
  <rect x="8" y="141.8" width="2.6" height="47.2" fill="#5D6C7B" rx="1.3"/>
  <text x="17" y="153.8" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">Judge pool</text>
  <text x="17" y="163.8" font-family="WPSans" font-size="6.3" fill="#5D6C7B">2 x L40S, own quota</text>
  <text x="17" y="174.8" font-family="WPSans" font-size="6.2" fill="#26333F">async sampling at 5-20%</text>
  <text x="17" y="184.4" font-family="WPSans" font-size="6.2" fill="#26333F">hard concurrency cap</text>
  <rect x="167.333" y="140.8" width="153.333" height="49.2" fill="#EDEAF7" rx="3" stroke="#5B4B9E" stroke-width="1"/>
  <rect x="167.333" y="141.8" width="2.6" height="47.2" fill="#5B4B9E" rx="1.3"/>
  <text x="176.333" y="153.8" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">Frontier tier</text>
  <text x="176.333" y="163.8" font-family="WPSans" font-size="6.3" fill="#5D6C7B">API with reserved capacity</text>
  <text x="176.333" y="174.8" font-family="WPSans" font-size="6.2" fill="#26333F">Tier 3, 1-4% of turns</text>
  <text x="176.333" y="184.4" font-family="WPSans" font-size="6.2" fill="#26333F">local fallback defined</text>
  <rect x="326.667" y="140.8" width="153.333" height="39.6" fill="#FFFFFF" rx="3" stroke="#D2DAE2" stroke-width="1"/>
  <rect x="326.667" y="141.8" width="2.6" height="37.6" fill="#D2DAE2" rx="1.3"/>
  <text x="335.667" y="153.8" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">Durable workers</text>
  <text x="335.667" y="163.8" font-family="WPSans" font-size="6.3" fill="#5D6C7B">CPU only</text>
  <text x="335.667" y="174.8" font-family="WPSans" font-size="6.2" fill="#26333F">queue, workflow, retries</text>
  <line x1="8" y1="202" x2="480" y2="202" stroke="#E7ECF1" stroke-width="0.8"/>
  <text x="8" y="215" font-family="WPSans" font-size="7.2" fill="#16202B" font-weight="bold">Sizing arithmetic</text>
  <text x="14" y="226" font-family="WPSans" font-size="6.5" fill="#5D6C7B">Peak concurrent sessions</text>
  <text x="474" y="226" font-family="WPSans" font-size="6.5" fill="#16202B" text-anchor="end" font-weight="bold">3,000</text>
  <line x1="14" y1="229.2" x2="474" y2="229.2" stroke="#E7ECF1" stroke-width="0.5"/>
  <text x="14" y="238.5" font-family="WPSans" font-size="6.5" fill="#5D6C7B">In flight requests at peak</text>
  <text x="474" y="238.5" font-family="WPSans" font-size="6.5" fill="#16202B" text-anchor="end" font-weight="bold">about 260</text>
  <line x1="14" y1="241.7" x2="474" y2="241.7" stroke="#E7ECF1" stroke-width="0.5"/>
  <text x="14" y="251" font-family="WPSans" font-size="6.5" fill="#5D6C7B">Control path calls per second</text>
  <text x="474" y="251" font-family="WPSans" font-size="6.5" fill="#16202B" text-anchor="end" font-weight="bold">about 310</text>
  <line x1="14" y1="254.2" x2="474" y2="254.2" stroke="#E7ECF1" stroke-width="0.5"/>
  <text x="14" y="263.5" font-family="WPSans" font-size="6.5" fill="#5D6C7B">Control path tokens per second</text>
  <text x="474" y="263.5" font-family="WPSans" font-size="6.5" fill="#16202B" text-anchor="end" font-weight="bold">about 62,000</text>
  <line x1="14" y1="266.7" x2="474" y2="266.7" stroke="#E7ECF1" stroke-width="0.5"/>
  <text x="14" y="276" font-family="WPSans" font-size="6.5" fill="#5D6C7B">Guardrail calls per second</text>
  <text x="474" y="276" font-family="WPSans" font-size="6.5" fill="#16202B" text-anchor="end" font-weight="bold">about 340</text>
  <line x1="14" y1="279.2" x2="474" y2="279.2" stroke="#E7ECF1" stroke-width="0.5"/>
  <text x="14" y="288.5" font-family="WPSans" font-size="6.5" fill="#5D6C7B">GPU count, steady state</text>
  <text x="474" y="288.5" font-family="WPSans" font-size="6.5" fill="#16202B" text-anchor="end" font-weight="bold">11 plus 2 spare</text>
  <line x1="14" y1="291.7" x2="474" y2="291.7" stroke="#E7ECF1" stroke-width="0.5"/>
  <text x="14" y="301" font-family="WPSans" font-size="6.5" fill="#5D6C7B">Utilisation target, fast tier</text>
  <text x="474" y="301" font-family="WPSans" font-size="6.5" fill="#16202B" text-anchor="end" font-weight="bold">45 to 60%</text>
  <line x1="14" y1="304.2" x2="474" y2="304.2" stroke="#E7ECF1" stroke-width="0.5"/>
  <rect x="8" y="319.5" width="472" height="78.8" fill="#F7F9FB" rx="3" stroke="#E7ECF1" stroke-width="0.9"/>
  <text x="15" y="333.5" font-family="WPSans" font-size="6.3" fill="#1C5A9E">•</text>
  <text x="22" y="333.5" font-family="WPSans" font-size="6.4" fill="#26333F">Separate pools exist to stop a judge burst or a guard-model retry storm from consuming the capacity the fast path needs. One</text>
  <text x="22" y="343.1" font-family="WPSans" font-size="6.4" fill="#26333F">shared pool re-couples what the architecture just separated.</text>
  <text x="15" y="355.1" font-family="WPSans" font-size="6.3" fill="#1C5A9E">•</text>
  <text x="22" y="355.1" font-family="WPSans" font-size="6.4" fill="#26333F">Size the fast tier on p99 under burst, not on mean throughput. A router at 85% utilisation has queue wait that dominates its</text>
  <text x="22" y="364.7" font-family="WPSans" font-size="6.4" fill="#26333F">own 20 ms service time.</text>
  <text x="15" y="376.7" font-family="WPSans" font-size="6.3" fill="#1C5A9E">•</text>
  <text x="22" y="376.7" font-family="WPSans" font-size="6.4" fill="#26333F">Reserve frontier capacity once escalation volume is predictable; pay-as-you-go quota becomes the binding constraint before</text>
  <text x="22" y="386.3" font-family="WPSans" font-size="6.4" fill="#26333F">your GPUs do.</text>
  <rect x="0.5" y="0.5" width="487" height="407.3" fill="none" rx="3" stroke="#E7ECF1" stroke-width="1"/>
</svg>
